{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خطای سرور | کشاورزی سبز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>

<body class="bg-earth-50 min-h-screen flex items-center justify-center px-4">

  <div class="text-center max-w-md">

      <i data-lucide="server-crash" class="w-14 h-14 text-red-300"></i>
    </div>

    <h2 class="text-xl font-bold text-earth-800 mb-3">خطای سرور</h2>
    <p class="text-earth-500 text-sm leading-relaxed mb-8">

    </p>
    <a href="/"
       class="inline-flex items-center gap-2 bg-earth-800 hover:bg-earth-700 text-white font-semibold px-6 py-3 rounded-xl transition">
      <i data-lucide="home" class="w-4 h-4"></i>
      بازگشت به خانه
    </a>
  </div>

  <script>lucide.createIcons();</script>

</html>
